name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: bash ./gradlew build --no-daemon --max-workers=2

      - name: Upload plugin jars
        uses: actions/upload-artifact@v4
        with:
          name: RedisEconomy-build-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            target/*.jar
          if-no-files-found: error
